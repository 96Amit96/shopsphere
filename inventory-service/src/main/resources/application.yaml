eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  resilience4j:
    retry:
      instances:
        inventoryOptimisticLockRetry:
          maxAttempts: 3
          waitDuration: 200ms
          retryExceptions:
            - org.springframework.orm.ObjectOptimisticLockingFailureException

